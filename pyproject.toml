[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "streamdrivebench-qa"
version = "0.1.0"
description = "Event-grounded HGI, AD and ETP generation from driving videos via a Responses-compatible vision API"
requires-python = ">=3.10"
dependencies = ["av>=12,<17", "Pillow>=10,<13"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
streamdrivebench = "streamdrivebench.cli:main"
streamdrivebench-specific = "streamdrivebench.specific:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
